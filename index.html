<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>9路盤 石取りゲーム</title>
<style>
  :root{
    --wood:#e0b562;
    --wood2:#d4a850;
    --line:#5b4326;
    --panel:#2b3440;
    --panel2:#333e4c;
    --accent:#3fae6b;
    --accent2:#2f9e5c;
    --danger:#d9603f;
    --danger2:#c5512f;
    --portal:#3b7ddd;
    --portal2:#2f6bc4;
    --text:#f4f1ea;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:linear-gradient(160deg,#1c2530,#28323f);
    color:var(--text);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:12px 10px 24px;
  }
  h1{font-size:1.25rem; margin:6px 0 2px; letter-spacing:.02em;}
  .sub{font-size:.8rem; color:#c7cdd6; margin-bottom:10px;}

  /* ===== 共通カード ===== */
  .card{
    width:100%; max-width:560px;
    background:var(--panel);
    border-radius:16px;
    padding:16px 16px 18px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }

  /* ===== スタート画面 ===== */
  #startScreen .row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:12px 0;}
  #startScreen label{font-size:.95rem;}
  select{
    font-size:1rem; padding:8px 10px; border-radius:10px; border:none;
    background:var(--panel2); color:var(--text); min-width:120px;
  }
  .note{font-size:.78rem; color:#aeb6c1; line-height:1.6; margin-top:6px;}

  button{
    font-family:inherit; font-weight:700; border:none; border-radius:12px;
    padding:13px 16px; font-size:1rem; color:#fff; cursor:pointer;
    transition:transform .05s ease, filter .15s ease;
  }
  button:active{transform:translateY(1px);}
  .btn-start{background:var(--accent); width:100%; margin-top:8px;}
  .btn-start:hover{background:var(--accent2);}
  .btn-quit{background:var(--danger);}
  .btn-quit:hover{background:var(--danger2);}
  .btn-again{background:var(--accent); width:100%;}
  .btn-again:hover{background:var(--accent2);}
  .btn-portal{
    background:var(--portal); display:inline-block; text-decoration:none;
    text-align:center; margin-top:10px;
  }
  .btn-portal:hover{background:var(--portal2);}

  /* ===== ゲーム画面 ===== */
  #gameScreen{display:none;}
  .scorebar{display:flex; gap:8px; margin-bottom:10px;}
  .score{
    flex:1; background:var(--panel2); border-radius:12px; padding:9px 10px; text-align:center;
  }
  .score .who{font-size:.82rem; color:#c7cdd6;}
  .score .num{font-size:1.5rem; font-weight:800; line-height:1.1;}
  .score .goal{font-size:.72rem; color:#9aa3ad;}
  .score.black .num{color:#f4f1ea;}
  .score.white .num{color:#ffd873;}

  .turn{
    text-align:center; font-weight:700; font-size:.98rem; margin:2px 0 12px;
    min-height:1.3em;
  }
  .turn.you{color:#8be0a4;}
  .turn.cpu{color:#ffce6b;}

  /* ===== 碁盤 ===== */
  #boardWrap{width:min(94vw, 60vh, 520px); margin:0 auto;}
  /* padding-bottom で高さ=幅の正方形を作る（全ブラウザ対応） */
  #boardRatio{position:relative; width:100%; padding-bottom:100%;}
  #board{
    position:absolute; top:0; left:0; right:0; bottom:0;
    width:100%; height:100%;
    background:linear-gradient(145deg,var(--wood),var(--wood2));
    border-radius:8px;
    box-shadow:inset 0 0 0 2px rgba(91,67,38,.25), 0 6px 16px rgba(0,0,0,.4);
    touch-action:manipulation;
  }
  .gline{position:absolute; background:var(--line);}
  .hoshi{
    position:absolute; width:2.4%; height:2.4%; background:var(--line);
    border-radius:50%; transform:translate(-50%,-50%); pointer-events:none;
  }
  .cell{
    position:absolute; width:11%; height:11%;
    transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; padding:0;
    pointer-events:none;            /* クリックは盤全体で受け取る */
  }
  .stone{
    width:88%; height:88%; border-radius:50%;
    box-shadow:1px 2px 3px rgba(0,0,0,.4);
    animation:pop .12s ease-out;
  }
  @keyframes pop{from{transform:scale(.6);}to{transform:scale(1);}}
  .stone.black{background:radial-gradient(circle at 34% 30%,#6b6b6b,#111 62%);}
  .stone.white{background:radial-gradient(circle at 34% 30%,#ffffff,#cfcfcf 70%);}
  .stone.last::after{
    content:""; position:absolute; width:26%; height:26%; border-radius:50%;
    left:50%; top:50%; transform:translate(-50%,-50%);
  }
  .stone.black.last::after{background:#ffd873;}
  .stone.white.last::after{background:#c5512f;}
  .cell .marker{position:relative; width:88%; height:88%; display:flex; align-items:center; justify-content:center;}

  .actions{display:flex; gap:8px; margin-top:14px;}
  .actions .btn-quit{flex:1;}

  /* ===== 結果オーバーレイ ===== */
  #overlay{
    display:none; position:fixed; inset:0; z-index:50;
    background:rgba(10,14,20,.72);
    align-items:center; justify-content:center; padding:20px;
  }
  #overlay .box{
    background:var(--panel); border-radius:18px; padding:26px 22px;
    width:100%; max-width:380px; text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
  }
  #overlay .result{font-size:1.7rem; font-weight:800; margin-bottom:8px;}
  #overlay .result.win{color:#8be0a4;}
  #overlay .result.lose{color:#ff9a7a;}
  #overlay .result.draw{color:#ffd873;}
  #overlay .result.quit{color:#c7cdd6;}
  #overlay .detail{font-size:.9rem; color:#c7cdd6; margin-bottom:18px; line-height:1.7;}

  /* ===== トースト ===== */
  #toast{
    position:fixed; left:50%; bottom:38px; transform:translateX(-50%) translateY(20px);
    background:rgba(0,0,0,.82); color:#fff; padding:10px 16px; border-radius:20px;
    font-size:.86rem; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    z-index:60;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ===== 検討（棋譜再生）===== */
  .btn-review{background:var(--portal); width:100%; margin-bottom:8px;}
  .btn-review:hover{background:var(--portal2);}
  #reviewArea{display:none; margin-top:12px;}
  #gameScreen.reviewing .scorebar,
  #gameScreen.reviewing .turn,
  #gameScreen.reviewing .actions{display:none;}
  #gameScreen.reviewing #reviewArea{display:block;}
  .review-status{
    text-align:center; font-weight:700; margin:10px 0; min-height:1.3em; color:#dfe4ea;
  }
  .review-nav{display:flex; gap:6px; justify-content:center; margin-bottom:10px;}
  .review-nav button{
    flex:1; background:var(--panel2); color:var(--text);
    padding:11px 0; font-size:1rem; border-radius:10px;
  }
  .review-nav button:disabled{opacity:.35;}
  .review-nav .play{background:var(--accent); max-width:110px;}
  .review-nav .play:hover{background:var(--accent2);}
  #kifuList{
    max-height:160px; overflow-y:auto; background:var(--panel2);
    border-radius:10px; padding:6px; margin-bottom:12px;
    -webkit-overflow-scrolling:touch;
  }
  .kifu-row{
    display:flex; gap:8px; padding:7px 8px; border-radius:6px;
    font-size:.92rem; cursor:pointer;
  }
  .kifu-row:hover{background:rgba(255,255,255,.06);}
  .kifu-row.active{background:var(--portal); color:#fff;}
  .kifu-no{width:2.2em; color:#9aa3ad; text-align:right;}
  .kifu-row.active .kifu-no{color:#e8eefc;}
  .review-actions{display:flex; gap:8px;}
  .review-actions .btn-again{flex:1;}
</style>

<body>

  <h1>9路盤 石取りゲーム</h1>
  <div class="sub">あなた（黒）× コンピュータ（白）　先番はあなたです</div>

  <!-- ===== スタート画面 ===== -->
  <div id="startScreen" class="card">
    <div class="row">

  <!-- ===== 結果オーバーレイ ===== -->
  <div id="overlay">

  <div id="toast"></div>

<script>
/* =========================================================
   9路盤 石取りゲーム
   人間（黒・先番） × コンピュータ（白）
   ========================================================= */

const N = 9;
const EMPTY = 0, BLACK = 1, WHITE = 2;
const HUMAN = BLACK, CPU = WHITE;
const HAND  = 30;              // 一人あたりの持ち石

/* --- 初期配置（黒2・白2）--------------------------------
   ここを書き換えれば、盤面の初期石を自由に変更できます。
   [行, 列, 色]  色は BLACK か WHITE。行・列は 0〜8。
   下は中央のクロス（切り違い）。黒が天元(4,4)。          */
const INITIAL = [
  [4, 4, BLACK],   // 天元・黒（右上）
  [5, 3, BLACK],   // 黒（左下）
  [4, 3, WHITE],   // 白（左上）
  [5, 4, WHITE],   // 白（右下）
];

const STAR = [[2,2],[2,6],[6,2],[6,6],[4,4]]; // 星（見た目用）
const NB = [[-1,0],[1,0],[0,-1],[0,1]];

/* --- 状態 --- */
let board, turn, koPoint, gameOver;
let capB, capW;        // 黒が取った数 / 白が取った数
let placedB, placedW;  // 打った石の数
let targetB, targetW;  // 勝利条件
let lastMove;          // 直前に打った位置
let busy;              // CPU思考中などの入力ロック
let history;           // 棋譜（各手 {color,r,c,cap}）。対局ごとにリセット
let positions;         // 各手後の盤面スナップショット（positions[0]=初期配置）
let reviewMode;        // 検討モードか
let reviewIndex;       // 検討中に表示している手数
let autoTimer = null;  // 自動再生のタイマー

/* --- 盤ユーティリティ --- */
function idxOf(r,c){ return r*N + c; }
function inB(r,c){ return r>=0 && r<N && c>=0 && c<N; }
function cloneBoard(b){ return b.map(row=>row.slice()); }

function newBoard(){
  const b = [];
  for(let r=0;r<N;r++) b.push(new Array(N).fill(EMPTY));
  for(const [r,c,col] of INITIAL) b[r][c] = col;
  return b;
}

/* 連（つながった同色の石）を取得 */
function group(b,r,c){
  const col = b[r][c];
  if(col===EMPTY) return [];
  const seen = new Set([idxOf(r,c)]);
  const st = [[r,c]], res = [];
  while(st.length){
    const [y,x] = st.pop(); res.push([y,x]);
    for(const [dy,dx] of NB){
      const ny=y+dy, nx=x+dx;
      if(inB(ny,nx) && b[ny][nx]===col && !seen.has(idxOf(ny,nx))){
        seen.add(idxOf(ny,nx)); st.push([ny,nx]);
      }
    }
  }
  return res;
}

/* 連の呼吸点（ダメ）の数 */
function libCount(b,grp){
  const s = new Set();
  for(const [y,x] of grp){
    for(const [dy,dx] of NB){
      const ny=y+dy, nx=x+dx;
      if(inB(ny,nx) && b[ny][nx]===EMPTY) s.add(idxOf(ny,nx));
    }
  }
  return s.size;
}

/* 着手を試す。合法なら結果を返し、非合法なら null */
function tryMove(b,r,c,color,ko){
  if(b[r][c]!==EMPTY) return null;                    // 既に石がある
  if(ko && ko.r===r && ko.c===c) return null;         // コウ
  const nb = cloneBoard(b);
  nb[r][c] = color;
  const opp = (color===BLACK) ? WHITE : BLACK;
  const captured = [];
  for(const [dy,dx] of NB){
    const ny=r+dy, nx=c+dx;
    if(inB(ny,nx) && nb[ny][nx]===opp){
      const g = group(nb,ny,nx);
      if(libCount(nb,g)===0){
        for(const [yy,xx] of g){ nb[yy][xx]=EMPTY; captured.push([yy,xx]); }
      }
    }
  }
  const mg = group(nb,r,c);
  const ml = libCount(nb,mg);
  if(ml===0) return null;                             // 自殺手
  let newKo = null;
  if(captured.length===1 && mg.length===1 && ml===1){
    newKo = { r:captured[0][0], c:captured[0][1] };
  }
  return { board:nb, captured, ko:newKo, myLibs:ml, myGroupSize:mg.length };
}

/* =========================================================
   コンピュータ（白）の思考
   ・数手先まで読む αβ 探索
   ・シチョウ（取られる筋）の読み
   ・同点級の手からランダム選択でワンパターンを回避
   ========================================================= */
let cpuDepth = 4;          // 読みの深さ（強さ）。1=よわい 2=ふつう 4=つよい
const NODE_LIMIT = 60000;  // 保険：これを超えたら探索を打ち切る
const LADDER_MAX = 40;     // シチョウ読みの上限
let nodeCount = 0;

/* 連の呼吸点（座標のリスト）*/
function libsListG(b,grp){
  const s = new Map();
  for(const [y,x] of grp){
    for(const [dy,dx] of NB){
      const ny=y+dy, nx=x+dx;
      if(inB(ny,nx) && b[ny][nx]===EMPTY) s.set(idxOf(ny,nx),[ny,nx]);
    }
  }
  return [...s.values()];
}

/* シチョウ判定：(r,c) を含む連（アタリの側）が逃げても取られるか */
function ladderCaptured(b,r,c,d){
  if(d>LADDER_MAX) return false;          // 読み切れない→安全側で逃げ切り扱い
  const defender = b[r][c];
  if(defender===EMPTY) return true;       // すでに取られている
  const attacker = (defender===BLACK)?WHITE:BLACK;
  const g = group(b,r,c);
  const Ls = libsListG(b,g);
  if(Ls.length>=2) return false;          // アタリではない
  if(Ls.length===0) return true;
  const [er,ec] = Ls[0];
  const run = tryMove(b,er,ec,defender,null);   // 逃げてみる
  if(!run) return true;                    // 打てない（自殺）→取られる
  const g2 = group(run.board,er,ec);
  const l2 = libsListG(run.board,g2);
  if(l2.length>=3) return false;           // 逃げ切り
  if(l2.length<=1) return true;            // 逃げてもまだアタリ→取られる
  // 呼吸点2つ：攻め手が続けば取られる
  for(const [ar,ac] of l2){
    const atk = tryMove(run.board,ar,ac,attacker,null);
    if(!atk) continue;
    let rep=null;
    for(const [gy,gx] of g2){ if(atk.board[gy][gx]===defender){ rep=[gy,gx]; break; } }
    if(!rep) return true;                  // 逃げた石が取られた
    const dl = libCount(atk.board, group(atk.board,rep[0],rep[1]));
    if(dl===1 && ladderCaptured(atk.board,rep[0],rep[1],d+1)) return true;
  }
  return false;                            // どう攻めても取れない→逃げ切り
}

/* 盤の評価（白から見た点数。プラスなら白有利）*/
function evalWhite(b,cW,cB){
  let s = 1000*(cW - cB);                  // 取った石差を最重視（1個=1000点）
  const seen = new Set();
  for(let r=0;r<N;r++){
    for(let c=0;c<N;c++){
      const v=b[r][c];
      if(v===EMPTY || seen.has(idxOf(r,c))) continue;
      const g=group(b,r,c);
      for(const p of g) seen.add(idxOf(p[0],p[1]));
      const L=libCount(b,g);
      const sign=(v===WHITE)?1:-1;         // 白の連は加点方向、黒の連は減点方向
      if(L===1){
        const dead = ladderCaptured(b,g[0][0],g[0][1],0);
        const val = dead ? 30*g.length : 8*g.length;  // 取られ確定ならより大きく
        s -= sign*val;
      }else{
        s += sign * Math.min(L,4) * 1.5;   // 呼吸点が多い連は安全
      }
    }
  }
  return s;
}

/* 探索対象の候補手を作る（石の近くに限定して高速化）*/
function genCandidates(b,color,ko,limit){
  // アタリの自分の連（シチョウでなく逃げ切れるもの）の呼吸点＝救援点を先に洗い出す
  const rescue = new Set();
  const seenG = new Set();
  for(let r=0;r<N;r++){
    for(let c=0;c<N;c++){
      if(b[r][c]===color && !seenG.has(idxOf(r,c))){
        const g=group(b,r,c);
        for(const p of g) seenG.add(idxOf(p[0],p[1]));
        const ls=libsListG(b,g);
        if(ls.length===1 && !ladderCaptured(b,r,c,0)){
          rescue.add(idxOf(ls[0][0], ls[0][1]));
        }
      }
    }
  }
  const near = [];
  for(let r=0;r<N;r++){
    for(let c=0;c<N;c++){
      if(b[r][c]!==EMPTY) continue;
      let ok=false;
      for(let dr=-2;dr<=2 && !ok;dr++){
        for(let dc=-2;dc<=2;dc++){
          const y=r+dr, x=c+dc;
          if(inB(y,x) && b[y][x]!==EMPTY){ ok=true; break; }
        }
      }
      if(!ok) continue;
      const mv=tryMove(b,r,c,color,ko);
      if(!mv) continue;
      let q = quickScore(b,r,c,mv);
      if(rescue.has(idxOf(r,c)) && mv.myLibs>=2) q += 130; // 逃げれば助かるアタリの救援手
      near.push({r,c,mv,cap:mv.captured.length,q});
    }
  }
  near.sort((a,z)=>z.q-a.q);          // 良さそうな手から並べる（αβが効きやすい）
  return near.slice(0, limit||24);    // 分岐を抑える
}

function quickScore(b,r,c,mv){
  let s = mv.captured.length*120;
  if(mv.myLibs===1 && mv.captured.length===0) s -= 40; // 自らアタリ
  s += mv.myLibs;
  const center=(N-1)/2;
  s += (4-Math.max(Math.abs(r-center),Math.abs(c-center)))*0.6;
  return s;
}

/* αβ探索（白は最大化、黒は最小化）*/
function search(b,color,cW,cB,depth,alpha,beta,ko){
  if(cW>=targetW) return  100000+depth;   // 白の勝ち（早いほど高評価）
  if(cB>=targetB) return -100000-depth;   // 黒の勝ち
  if(depth===0 || nodeCount>NODE_LIMIT) return evalWhite(b,cW,cB);
  const limit = 8 + depth*4;              // 浅い枝ほど広く、深い枝は絞る
  const cands=genCandidates(b,color,ko,limit);
  if(!cands.length) return evalWhite(b,cW,cB);
  if(color===WHITE){
    let best=-Infinity;
    for(const m of cands){
      nodeCount++;
      const v=search(m.mv.board,BLACK,cW+m.cap,cB,depth-1,alpha,beta,m.mv.ko);
      if(v>best) best=v;
      if(best>alpha) alpha=best;
      if(alpha>=beta) break;
    }
    return best;
  }else{
    let best=Infinity;
    for(const m of cands){
      nodeCount++;
      const v=search(m.mv.board,WHITE,cW,cB+m.cap,depth-1,alpha,beta,m.mv.ko);
      if(v<best) best=v;
      if(best<beta) beta=best;
      if(alpha>=beta) break;
    }
    return best;
  }
}

/* 実際に打つ手を選ぶ */
function cpuMove(){
  nodeCount=0;
  const cands=genCandidates(board,CPU,koPoint);
  if(!cands.length) return null;
  let bestV=-Infinity;
  for(const m of cands){
    const v=search(m.mv.board,HUMAN,capW+m.cap,capB,cpuDepth-1,-Infinity,Infinity,m.mv.ko);
    m._v=v;
    if(v>bestV) bestV=v;
  }
  // 評価がほぼ同点の手からランダムに選び、ワンパターンを避ける
  const pool=cands.filter(m=>m._v>=bestV-6);
  const pick=pool[Math.floor(Math.random()*pool.length)] || cands[0];
  return {r:pick.r, c:pick.c, mv:pick.mv};
}


/* =========================================================
   着手の適用・勝敗判定
   ========================================================= */
function applyMove(mv,color){
  board = mv.board;
  koPoint = mv.ko;
  // lastMove は呼び出し側で着手点をセット済み
  if(color===BLACK){ capB += mv.captured.length; placedB++; }
  else            { capW += mv.captured.length; placedW++; }
  history.push({color, r:lastMove.r, c:lastMove.c, cap:mv.captured.length});
  positions.push(cloneBoard(board));
  render();

  if(color===BLACK && capB>=targetB){ endGame('you');  return true; }
  if(color===WHITE && capW>=targetW){ endGame('cpu');  return true; }
  if(placedB>=HAND && placedW>=HAND){ endGame('draw'); return true; }
  return false;
}

/* =========================================================
   入力処理
   ========================================================= */
function onCellClick(r,c){
  if(gameOver || busy || turn!==HUMAN) return;
  const mv = tryMove(board,r,c,HUMAN,koPoint);
  if(!mv){ showToast(reasonIllegal(r,c)); return; }

  lastMove = {r,c};
  const done = applyMove(mv,BLACK);
  if(done) return;

  turn = WHITE; updateTurn(); busy = true;
  setTimeout(doCpuTurn, 480);
}

function doCpuTurn(){
  const choice = cpuMove();
  if(!choice){                 // 打てる手がない（実質パス）
    busy = false; turn = HUMAN; updateTurn();
    showToast('コンピュータはパスしました');
    return;
  }
  lastMove = {r:choice.r, c:choice.c};
  const done = applyMove(choice.mv, WHITE);
  busy = false;
  if(done) return;
  turn = HUMAN; updateTurn();
}

function reasonIllegal(r,c){
  if(board[r][c]!==EMPTY) return 'そこには石があります';
  if(koPoint && koPoint.r===r && koPoint.c===c) return 'コウのため、すぐには打てません';
  return 'そこには打てません（自殺手）';
}

/* =========================================================
   ゲーム終了
   ========================================================= */
function endGame(kind){
  gameOver = true;
  const rt = document.getElementById('resultText');
  const rd = document.getElementById('resultDetail');
  rt.className = 'result';
  if(kind==='you'){
    rt.textContent = 'あなたの勝ちです';
    rt.classList.add('win');
  }else if(kind==='cpu'){
    rt.textContent = '私の勝ちです';
    rt.classList.add('lose');
  }else if(kind==='draw'){
    rt.textContent = '引き分けです';
    rt.classList.add('draw');
  }else{ // quit
    rt.textContent = '対局を終了しました';
    rt.classList.add('quit');
  }
  rd.innerHTML = 'あなた（黒）が取った石：' + capB + ' 個<br>'
               + 'コンピュータ（白）が取った石：' + capW + ' 個';
  document.getElementById('btnReview').style.display = history.length>0 ? 'block' : 'none';
  document.getElementById('overlay').style.display = 'flex';
}

/* =========================================================
   画面切り替え・描画
   ========================================================= */
function showScreen(name){
  const s = document.getElementById('startScreen');
  const g = document.getElementById('gameScreen');
  // 空文字だとCSSの display:none が残ってしまうため 'block' を明示する
  if(name==='game'){ s.style.display='none'; g.style.display='block'; }
  else            { s.style.display='block'; g.style.display='none';  } // 既定はスタート画面
}

function buildBoard(){
  const el = document.getElementById('board');
  el.innerHTML = '';
  const first = 6, gap = 11;          // %：最初の線位置と間隔
  const last  = first + gap*(N-1);    // = 94%

  // 罫線
  for(let i=0;i<N;i++){
    const p = first + gap*i;
    const h = document.createElement('div');
    h.className='gline';
    h.style.left=first+'%'; h.style.top=p+'%';
    h.style.width=(last-first)+'%'; h.style.height='1.5px';
    el.appendChild(h);
    const v = document.createElement('div');
    v.className='gline';
    v.style.top=first+'%'; v.style.left=p+'%';
    v.style.height=(last-first)+'%'; v.style.width='1.5px';
    el.appendChild(v);
  }
  // 星
  for(const [r,c] of STAR){
    const s=document.createElement('div');
    s.className='hoshi';
    s.style.left=(first+gap*c)+'%'; s.style.top=(first+gap*r)+'%';
    el.appendChild(s);
  }
  // 交点セル（石を置く器。クリックは盤全体で受ける）
  cellEls = [];
  for(let r=0;r<N;r++){
    cellEls.push([]);
    for(let c=0;c<N;c++){
      const b=document.createElement('div');
      b.className='cell';
      b.style.left=(first+gap*c)+'%'; b.style.top=(first+gap*r)+'%';
      el.appendChild(b);
      cellEls[r].push(b);
    }
  }

  // 盤全体で1回だけクリックを受け、押された位置から最も近い交点を計算する
  el.addEventListener('click', (e)=>{
    const rect = el.getBoundingClientRect();
    if(rect.width===0) return;
    const x = (e.clientX - rect.left) / rect.width  * 100; // ％
    const y = (e.clientY - rect.top ) / rect.height * 100;
    const cc = Math.round((x - first) / gap);
    const rr = Math.round((y - first) / gap);
    if(rr<0 || rr>=N || cc<0 || cc>=N) return;
    onCellClick(rr, cc);
  });
}

let cellEls = [];

/* 任意の盤面を描画（直前手 last に印）。対局・検討の両方で使う */
function drawStones(bd, last){
  for(let r=0;r<N;r++){
    for(let c=0;c<N;c++){
      const cell = cellEls[r][c];
      const v = bd[r][c];
      if(v===EMPTY){ cell.innerHTML=''; continue; }
      const isLast = last && last.r===r && last.c===c;
      const cur = cell.firstChild;
      const wantClass = 'stone ' + (v===BLACK?'black':'white') + (isLast?' last':'');
      if(cur && cur.className===wantClass) continue;
      cell.innerHTML='';
      const st=document.createElement('div');
      st.className=wantClass;
      cell.appendChild(st);
    }
  }
}

function render(){
  drawStones(board, lastMove);
  document.getElementById('capBlack').textContent = capB;
  document.getElementById('capWhite').textContent = capW;
  document.getElementById('goalBlack').textContent = '勝利まで ' + targetB + '個';
  document.getElementById('goalWhite').textContent = '勝利まで ' + targetW + '個';
}

function updateTurn(){
  const t=document.getElementById('turnText');
  if(turn===HUMAN){ t.textContent='あなたの番です'; t.className='turn you'; }
  else            { t.textContent='コンピュータが考えています…'; t.className='turn cpu'; }
}

/* =========================================================
   棋譜の確認・検討（対局後）
   ========================================================= */
function coordName(r,c){
  const cols="ABCDEFGHJ";        // 9路は I を飛ばすのが慣例
  return cols[c] + (r+1);
}

function enterReview(){
  document.getElementById('overlay').style.display='none';
  reviewMode = true;
  document.getElementById('gameScreen').classList.add('reviewing');
  buildKifu();
  gotoIndex(positions.length-1);   // まず最終局面を表示
}

function buildKifu(){
  const list=document.getElementById('kifuList');
  list.innerHTML='';
  if(history.length===0){
    list.innerHTML='<div class="kifu-row"><span>（着手はありません）</span></div>';
    return;
  }
  history.forEach((h,i)=>{
    const row=document.createElement('div');
    row.className='kifu-row'; row.dataset.idx=String(i+1);
    const mark = h.color===BLACK?'●':'○';
    const who  = h.color===BLACK?'黒':'白';
    const capTxt = h.cap ? ' ×'+h.cap : '';
    row.innerHTML='<span class="kifu-no">'+(i+1)+'.</span><span>'+mark+' '+who+' '+coordName(h.r,h.c)+capTxt+'</span>';
    row.addEventListener('click',()=>{ stopAutoPlay(); gotoIndex(i+1); });
    list.appendChild(row);
  });
}

function gotoIndex(idx){
  reviewIndex = Math.max(0, Math.min(positions.length-1, idx));
  const last = reviewIndex>0 ? history[reviewIndex-1] : null;
  drawStones(positions[reviewIndex], last);
  updateReviewUI();
}

function updateReviewUI(){
  const total = positions.length-1;   // 総手数
  const st=document.getElementById('reviewStatus');
  if(reviewIndex===0){
    st.textContent='対局開始前（黒2・白2 の配置）';
  }else{
    const h=history[reviewIndex-1];
    const who=h.color===BLACK?'黒':'白';
    const cap=h.cap ? '　'+(h.color===BLACK?'白':'黒')+h.cap+'子を取る' : '';
    st.textContent = reviewIndex+' / '+total+'手目　'+who+' '+coordName(h.r,h.c)+cap;
  }
  document.getElementById('rvFirst').disabled = reviewIndex===0;
  document.getElementById('rvPrev').disabled  = reviewIndex===0;
  document.getElementById('rvNext').disabled  = reviewIndex===total;
  document.getElementById('rvLast').disabled  = reviewIndex===total;
  const rows=document.querySelectorAll('#kifuList .kifu-row');
  rows.forEach(r=>{
    const on = parseInt(r.dataset.idx,10)===reviewIndex;
    r.classList.toggle('active', on);
    if(on && r.scrollIntoView) r.scrollIntoView({block:'nearest'});
  });
}

function stopAutoPlay(){
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; }
  const b=document.getElementById('rvPlay');
  if(b) b.textContent='▶ 再生';
}

function toggleAutoPlay(){
  if(autoTimer){ stopAutoPlay(); return; }
  if(reviewIndex>=positions.length-1) gotoIndex(0);   // 最後なら頭から
  document.getElementById('rvPlay').textContent='⏸ 停止';
  autoTimer=setInterval(()=>{
    if(reviewIndex>=positions.length-1){ stopAutoPlay(); return; }
    gotoIndex(reviewIndex+1);
  }, 850);
}

/* =========================================================
   ゲーム開始
   ========================================================= */
function startGame(){
  targetB = parseInt(document.getElementById('selBlack').value,10);
  targetW = parseInt(document.getElementById('selWhite').value,10);
  cpuDepth = parseInt(document.getElementById('selLevel').value,10);
  board = newBoard();
  turn = HUMAN; koPoint = null; gameOver = false;
  capB = 0; capW = 0; placedB = 0; placedW = 0;
  lastMove = null; busy = false;
  history = [];
  positions = [cloneBoard(board)];   // 初期配置を0手目として保存
  reviewMode = false; reviewIndex = 0;
  stopAutoPlay();
  document.getElementById('gameScreen').classList.remove('reviewing');
  showScreen('game');
  render();
  updateTurn();
}

/* =========================================================
   初期化
   ========================================================= */
function init(){
  // 勝利条件の選択肢（1〜20個）
  const selB=document.getElementById('selBlack');
  const selW=document.getElementById('selWhite');
  for(let i=1;i<=10;i++){
    const o1=document.createElement('option'); o1.value=i; o1.textContent=i+'個'; selB.appendChild(o1);
    const o2=document.createElement('option'); o2.value=i; o2.textContent=i+'個'; selW.appendChild(o2);
  }
  selB.value='5'; selW.value='5';

  buildBoard();

  document.getElementById('btnStart').addEventListener('click', startGame);
  document.getElementById('btnQuit').addEventListener('click', ()=>{
    if(!gameOver) endGame('quit');
  });
  document.getElementById('btnAgain').addEventListener('click', ()=>{
    document.getElementById('overlay').style.display='none';
    showScreen('start');
  });

  // 検討（棋譜再生）
  document.getElementById('btnReview').addEventListener('click', enterReview);
  document.getElementById('rvFirst').addEventListener('click', ()=>{ stopAutoPlay(); gotoIndex(0); });
  document.getElementById('rvPrev' ).addEventListener('click', ()=>{ stopAutoPlay(); gotoIndex(reviewIndex-1); });
  document.getElementById('rvNext' ).addEventListener('click', ()=>{ stopAutoPlay(); gotoIndex(reviewIndex+1); });
  document.getElementById('rvLast' ).addEventListener('click', ()=>{ stopAutoPlay(); gotoIndex(positions.length-1); });
  document.getElementById('rvPlay' ).addEventListener('click', toggleAutoPlay);
  document.getElementById('rvNewGame').addEventListener('click', ()=>{
    stopAutoPlay();
    document.getElementById('gameScreen').classList.remove('reviewing');
    showScreen('start');
  });

  showScreen('start');
}

init();
</script>
