<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>9路盤 石取りゲーム</title>
<style>
  :root{
    --wood:#e0b562;
    --wood2:#d4a850;
    --line:#5b4326;
    --panel:#2b3440;
    --panel2:#333e4c;
    --accent:#3fae6b;
    --accent2:#2f9e5c;
    --danger:#d9603f;
    --danger2:#c5512f;
    --portal:#3b7ddd;
    --portal2:#2f6bc4;
    --text:#f4f1ea;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:linear-gradient(160deg,#1c2530,#28323f);
    color:var(--text);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:12px 10px 24px;
  }
  h1{font-size:1.25rem; margin:6px 0 2px; letter-spacing:.02em;}
  .sub{font-size:.8rem; color:#c7cdd6; margin-bottom:10px;}

  /* ===== 共通カード ===== */
  .card{
    width:100%; max-width:560px;
    background:var(--panel);
    border-radius:16px;
    padding:16px 16px 18px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }

  /* ===== スタート画面 ===== */
  #startScreen .row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:12px 0;}
  #startScreen label{font-size:.95rem;}
  select{
    font-size:1rem; padding:8px 10px; border-radius:10px; border:none;
    background:var(--panel2); color:var(--text); min-width:120px;
  }
  .note{font-size:.78rem; color:#aeb6c1; line-height:1.6; margin-top:6px;}

  button{
    font-family:inherit; font-weight:700; border:none; border-radius:12px;
    padding:13px 16px; font-size:1rem; color:#fff; cursor:pointer;
    transition:transform .05s ease, filter .15s ease;
  }
  button:active{transform:translateY(1px);}
  .btn-start{background:var(--accent); width:100%; margin-top:8px;}
  .btn-start:hover{background:var(--accent2);}
  .btn-quit{background:var(--danger);}
  .btn-quit:hover{background:var(--danger2);}
  .btn-again{background:var(--accent); width:100%;}
  .btn-again:hover{background:var(--accent2);}
  .btn-portal{
    background:var(--portal); display:inline-block; text-decoration:none;
    text-align:center; margin-top:10px;
  }
  .btn-portal:hover{background:var(--portal2);}

  /* ===== ゲーム画面 ===== */
  #gameScreen{display:none;}
  .scorebar{display:flex; gap:8px; margin-bottom:10px;}
  .score{
    flex:1; background:var(--panel2); border-radius:12px; padding:9px 10px; text-align:center;
  }
  .score .who{font-size:.82rem; color:#c7cdd6;}
  .score .num{font-size:1.5rem; font-weight:800; line-height:1.1;}
  .score .goal{font-size:.72rem; color:#9aa3ad;}
  .score.black .num{color:#f4f1ea;}
  .score.white .num{color:#ffd873;}

  .turn{
    text-align:center; font-weight:700; font-size:.98rem; margin:2px 0 12px;
    min-height:1.3em;
  }
  .turn.you{color:#8be0a4;}
  .turn.cpu{color:#ffce6b;}

  /* ===== 碁盤 ===== */
  #boardWrap{width:min(94vw, 60vh, 520px); margin:0 auto;}
  /* padding-bottom で高さ=幅の正方形を作る（全ブラウザ対応） */
  #boardRatio{position:relative; width:100%; padding-bottom:100%;}
  #board{
    position:absolute; top:0; left:0; right:0; bottom:0;
    width:100%; height:100%;
    background:linear-gradient(145deg,var(--wood),var(--wood2));
    border-radius:8px;
    box-shadow:inset 0 0 0 2px rgba(91,67,38,.25), 0 6px 16px rgba(0,0,0,.4);
    touch-action:manipulation;
  }
  .gline{position:absolute; background:var(--line);}
  .hoshi{
    position:absolute; width:2.4%; height:2.4%; background:var(--line);
    border-radius:50%; transform:translate(-50%,-50%); pointer-events:none;
  }
  .cell{
    position:absolute; width:11%; height:11%;
    transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; padding:0; cursor:pointer;
  }
  .stone{
    width:88%; height:88%; border-radius:50%;
    box-shadow:1px 2px 3px rgba(0,0,0,.4);
    animation:pop .12s ease-out;
  }
  @keyframes pop{from{transform:scale(.6);}to{transform:scale(1);}}
  .stone.black{background:radial-gradient(circle at 34% 30%,#6b6b6b,#111 62%);}
  .stone.white{background:radial-gradient(circle at 34% 30%,#ffffff,#cfcfcf 70%);}
  .stone.last::after{
    content:""; position:absolute; width:26%; height:26%; border-radius:50%;
    left:50%; top:50%; transform:translate(-50%,-50%);
  }
  .stone.black.last::after{background:#ffd873;}
  .stone.white.last::after{background:#c5512f;}
  .cell .marker{position:relative; width:88%; height:88%; display:flex; align-items:center; justify-content:center;}

  .actions{display:flex; gap:8px; margin-top:14px;}
  .actions .btn-quit{flex:1;}

  /* ===== 結果オーバーレイ ===== */
  #overlay{
    display:none; position:fixed; inset:0; z-index:50;
    background:rgba(10,14,20,.72);
    align-items:center; justify-content:center; padding:20px;
  }
  #overlay .box{
    background:var(--panel); border-radius:18px; padding:26px 22px;
    width:100%; max-width:380px; text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
  }
  #overlay .result{font-size:1.7rem; font-weight:800; margin-bottom:8px;}
  #overlay .result.win{color:#8be0a4;}
  #overlay .result.lose{color:#ff9a7a;}
  #overlay .result.draw{color:#ffd873;}
  #overlay .result.quit{color:#c7cdd6;}
  #overlay .detail{font-size:.9rem; color:#c7cdd6; margin-bottom:18px; line-height:1.7;}

  /* ===== トースト ===== */
  #toast{
    position:fixed; left:50%; bottom:38px; transform:translateX(-50%) translateY(20px);
    background:rgba(0,0,0,.82); color:#fff; padding:10px 16px; border-radius:20px;
    font-size:.86rem; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    z-index:60;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

  <h1>9路盤 石取りゲーム</h1>
  <div class="sub">あなた（黒）× コンピュータ（白）　先番はあなたです</div>

  <!-- ===== スタート画面 ===== -->
  <div id="startScreen" class="card">
    <div class="row">
      <label>黒（あなた）は何個取ったら勝ち？</label>
      <select id="selBlack"></select>
    </div>
    <div class="row">
      <label>白（コンピュータ）は何個取ったら勝ち？</label>
      <select id="selWhite"></select>
    </div>
    <button class="btn-start" id="btnStart">対局開始</button>
    <div class="note">
      ・石取りゲームです。相手の石を囲んで取り、決めた数だけ取ったら勝ちです。<br>
      ・黒・白ともに持ち石は30個。両方使い切っても勝敗がつかなければ「引き分け」です。<br>
      ・初手前に、盤の中央に黒2個・白2個を置いた状態から始まります。
    </div>
    <a class="btn-portal" style="width:100%;" href="https://pecpec37-gift.github.io/portal/">Tommy-Goへ戻る</a>
  </div>

  <!-- ===== ゲーム画面 ===== -->
  <div id="gameScreen" class="card">
    <div class="scorebar">
      <div class="score black">
        <div class="who">あなた（黒）</div>
        <div class="num" id="capBlack">0</div>
        <div class="goal" id="goalBlack">勝利まで 5個</div>
      </div>
      <div class="score white">
        <div class="who">コンピュータ（白）</div>
        <div class="num" id="capWhite">0</div>
        <div class="goal" id="goalWhite">勝利まで 5個</div>
      </div>
    </div>
    <div class="turn you" id="turnText">あなたの番です</div>

    <div id="boardWrap">
      <div id="boardRatio">
        <div id="board"></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-quit" id="btnQuit">対局をやめる</button>
      <a class="btn-portal" style="flex:1;" href="https://pecpec37-gift.github.io/portal/">Tommy-Goへ戻る</a>
    </div>
  </div>

  <!-- ===== 結果オーバーレイ ===== -->
  <div id="overlay">
    <div class="box">
      <div class="result" id="resultText">あなたの勝ちです</div>
      <div class="detail" id="resultDetail"></div>
      <button class="btn-again" id="btnAgain">もう一度</button>
      <a class="btn-portal" style="width:100%;" href="https://pecpec37-gift.github.io/portal/">Tommy-Goへ戻る</a>
    </div>
  </div>

  <div id="toast"></div>

<script>
/* =========================================================
   9路盤 石取りゲーム
   人間（黒・先番） × コンピュータ（白）
   ========================================================= */

const N = 9;
const EMPTY = 0, BLACK = 1, WHITE = 2;
const HUMAN = BLACK, CPU = WHITE;
const HAND  = 30;              // 一人あたりの持ち石

/* --- 初期配置（黒2・白2）--------------------------------
   ここを書き換えれば、盤面の初期石を自由に変更できます。
   [行, 列, 色]  色は BLACK か WHITE。行・列は 0〜8。
   下は中央のクロス（切り違い）。黒が天元(4,4)。          */
const INITIAL = [
  [4, 4, BLACK],   // 天元・黒（右上）
  [5, 3, BLACK],   // 黒（左下）
  [4, 3, WHITE],   // 白（左上）
  [5, 4, WHITE],   // 白（右下）
];

const STAR = [[2,2],[2,6],[6,2],[6,6],[4,4]]; // 星（見た目用）
const NB = [[-1,0],[1,0],[0,-1],[0,1]];

/* --- 状態 --- */
let board, turn, koPoint, gameOver;
let capB, capW;        // 黒が取った数 / 白が取った数
let placedB, placedW;  // 打った石の数
let targetB, targetW;  // 勝利条件
let lastMove;          // 直前に打った位置
let busy;              // CPU思考中などの入力ロック

/* --- 盤ユーティリティ --- */
function idxOf(r,c){ return r*N + c; }
function inB(r,c){ return r>=0 && r<N && c>=0 && c<N; }
function cloneBoard(b){ return b.map(row=>row.slice()); }

function newBoard(){
  const b = [];
  for(let r=0;r<N;r++) b.push(new Array(N).fill(EMPTY));
  for(const [r,c,col] of INITIAL) b[r][c] = col;
  return b;
}

/* 連（つながった同色の石）を取得 */
function group(b,r,c){
  const col = b[r][c];
  if(col===EMPTY) return [];
  const seen = new Set([idxOf(r,c)]);
  const st = [[r,c]], res = [];
  while(st.length){
    const [y,x] = st.pop(); res.push([y,x]);
    for(const [dy,dx] of NB){
      const ny=y+dy, nx=x+dx;
      if(inB(ny,nx) && b[ny][nx]===col && !seen.has(idxOf(ny,nx))){
        seen.add(idxOf(ny,nx)); st.push([ny,nx]);
      }
    }
  }
  return res;
}

/* 連の呼吸点（ダメ）の数 */
function libCount(b,grp){
  const s = new Set();
  for(const [y,x] of grp){
    for(const [dy,dx] of NB){
      const ny=y+dy, nx=x+dx;
      if(inB(ny,nx) && b[ny][nx]===EMPTY) s.add(idxOf(ny,nx));
    }
  }
  return s.size;
}

/* 着手を試す。合法なら結果を返し、非合法なら null */
function tryMove(b,r,c,color,ko){
  if(b[r][c]!==EMPTY) return null;                    // 既に石がある
  if(ko && ko.r===r && ko.c===c) return null;         // コウ
  const nb = cloneBoard(b);
  nb[r][c] = color;
  const opp = (color===BLACK) ? WHITE : BLACK;
  const captured = [];
  for(const [dy,dx] of NB){
    const ny=r+dy, nx=c+dx;
    if(inB(ny,nx) && nb[ny][nx]===opp){
      const g = group(nb,ny,nx);
      if(libCount(nb,g)===0){
        for(const [yy,xx] of g){ nb[yy][xx]=EMPTY; captured.push([yy,xx]); }
      }
    }
  }
  const mg = group(nb,r,c);
  const ml = libCount(nb,mg);
  if(ml===0) return null;                             // 自殺手
  let newKo = null;
  if(captured.length===1 && mg.length===1 && ml===1){
    newKo = { r:captured[0][0], c:captured[0][1] };
  }
  return { board:nb, captured, ko:newKo, myLibs:ml, myGroupSize:mg.length };
}

/* =========================================================
   コンピュータ（白）の思考
   ========================================================= */
function cpuMove(){
  const legal = [];
  for(let r=0;r<N;r++){
    for(let c=0;c<N;c++){
      const mv = tryMove(board,r,c,CPU,koPoint);
      if(mv) legal.push({r,c,mv});
    }
  }
  if(!legal.length) return null;
  let best=null, bestScore=-1e18;
  for(const L of legal){
    const s = scoreMove(L.r,L.c,L.mv);
    if(s>bestScore){ bestScore=s; best=L; }
  }
  return best;
}

function scoreMove(r,c,mv){
  const nb = mv.board;
  let s = 0;

  /* 相手（黒）の石を取る手は最優先 */
  s += mv.captured.length * 90;
  if(capW + mv.captured.length >= targetW) s += 1e7; // これで勝てるなら即決

  /* 自分の連の安全度 */
  const mySize = mv.myGroupSize, myL = mv.myLibs;
  if(myL===1 && mv.captured.length===0) s -= (45 + 12*mySize); // 自らアタリは悪手
  s += myL * 2;

  /* アタリの自分の連を助ける手はプラス */
  s += rescueBonus(nb);

  /* 相手（黒）をアタリに追い込む手はプラス */
  s += atariBonus(nb);

  /* 中央・接触への軽いボーナス */
  s += contactCenterBonus(r,c);

  s += Math.random()*2; // 変化をつける
  return s;
}

/* 現在アタリの白の連が、この手で助かるか */
function rescueBonus(nb){
  let bonus = 0;
  const seen = new Set();
  for(let y=0;y<N;y++){
    for(let x=0;x<N;x++){
      if(board[y][x]===CPU && !seen.has(idxOf(y,x))){
        const g = group(board,y,x);
        for(const p of g) seen.add(idxOf(p[0],p[1]));
        if(libCount(board,g)===1){
          let rep=null;
          for(const [gy,gx] of g){ if(nb[gy][gx]===CPU){ rep=[gy,gx]; break; } }
          if(rep){
            const l2 = libCount(nb, group(nb,rep[0],rep[1]));
            if(l2>=2) bonus += 60 + 12*g.length;
          }
        }
      }
    }
  }
  return bonus;
}

/* この手のあと、黒の連をいくつアタリにできたか */
function atariBonus(nb){
  let b = 0;
  const seen = new Set();
  for(let y=0;y<N;y++){
    for(let x=0;x<N;x++){
      if(nb[y][x]===BLACK && !seen.has(idxOf(y,x))){
        const g = group(nb,y,x);
        for(const p of g) seen.add(idxOf(p[0],p[1]));
        if(libCount(nb,g)===1) b += 10 + 3*g.length;
      }
    }
  }
  return b;
}

function contactCenterBonus(r,c){
  const center = (N-1)/2;
  let s = (4 - Math.max(Math.abs(r-center), Math.abs(c-center))) * 0.6;
  for(const [dy,dx] of NB){
    const ny=r+dy, nx=c+dx;
    if(inB(ny,nx) && board[ny][nx]!==EMPTY){ s += 1.2; break; }
  }
  return s;
}

/* =========================================================
   着手の適用・勝敗判定
   ========================================================= */
function applyMove(mv,color){
  board = mv.board;
  koPoint = mv.ko;
  // lastMove は呼び出し側で着手点をセット済み
  if(color===BLACK){ capB += mv.captured.length; placedB++; }
  else            { capW += mv.captured.length; placedW++; }
  render();

  if(color===BLACK && capB>=targetB){ endGame('you');  return true; }
  if(color===WHITE && capW>=targetW){ endGame('cpu');  return true; }
  if(placedB>=HAND && placedW>=HAND){ endGame('draw'); return true; }
  return false;
}

/* =========================================================
   入力処理
   ========================================================= */
function onCellClick(r,c){
  if(gameOver || busy || turn!==HUMAN) return;
  const mv = tryMove(board,r,c,HUMAN,koPoint);
  if(!mv){ showToast(reasonIllegal(r,c)); return; }

  lastMove = {r,c};
  const done = applyMove(mv,BLACK);
  if(done) return;

  turn = WHITE; updateTurn(); busy = true;
  setTimeout(doCpuTurn, 480);
}

function doCpuTurn(){
  const choice = cpuMove();
  if(!choice){                 // 打てる手がない（実質パス）
    busy = false; turn = HUMAN; updateTurn();
    showToast('コンピュータはパスしました');
    return;
  }
  lastMove = {r:choice.r, c:choice.c};
  const done = applyMove(choice.mv, WHITE);
  busy = false;
  if(done) return;
  turn = HUMAN; updateTurn();
}

function reasonIllegal(r,c){
  if(board[r][c]!==EMPTY) return 'そこには石があります';
  if(koPoint && koPoint.r===r && koPoint.c===c) return 'コウのため、すぐには打てません';
  return 'そこには打てません（自殺手）';
}

/* =========================================================
   ゲーム終了
   ========================================================= */
function endGame(kind){
  gameOver = true;
  const rt = document.getElementById('resultText');
  const rd = document.getElementById('resultDetail');
  rt.className = 'result';
  if(kind==='you'){
    rt.textContent = 'あなたの勝ちです';
    rt.classList.add('win');
  }else if(kind==='cpu'){
    rt.textContent = '私の勝ちです';
    rt.classList.add('lose');
  }else if(kind==='draw'){
    rt.textContent = '引き分けです';
    rt.classList.add('draw');
  }else{ // quit
    rt.textContent = '対局を終了しました';
    rt.classList.add('quit');
  }
  rd.innerHTML = 'あなた（黒）が取った石：' + capB + ' 個<br>'
               + 'コンピュータ（白）が取った石：' + capW + ' 個';
  document.getElementById('overlay').style.display = 'flex';
}

/* =========================================================
   画面切り替え・描画
   ========================================================= */
function showScreen(name){
  const s = document.getElementById('startScreen');
  const g = document.getElementById('gameScreen');
  // 空文字だとCSSの display:none が残ってしまうため 'block' を明示する
  if(name==='game'){ s.style.display='none'; g.style.display='block'; }
  else            { s.style.display='block'; g.style.display='none';  } // 既定はスタート画面
}

function buildBoard(){
  const el = document.getElementById('board');
  el.innerHTML = '';
  const first = 6, gap = 11;          // %：最初の線位置と間隔
  const last  = first + gap*(N-1);    // = 94%

  // 罫線
  for(let i=0;i<N;i++){
    const p = first + gap*i;
    const h = document.createElement('div');
    h.className='gline';
    h.style.left=first+'%'; h.style.top=p+'%';
    h.style.width=(last-first)+'%'; h.style.height='1.5px';
    el.appendChild(h);
    const v = document.createElement('div');
    v.className='gline';
    v.style.top=first+'%'; v.style.left=p+'%';
    v.style.height=(last-first)+'%'; v.style.width='1.5px';
    el.appendChild(v);
  }
  // 星
  for(const [r,c] of STAR){
    const s=document.createElement('div');
    s.className='hoshi';
    s.style.left=(first+gap*c)+'%'; s.style.top=(first+gap*r)+'%';
    el.appendChild(s);
  }
  // 交点セル（タップ領域）
  cellEls = [];
  for(let r=0;r<N;r++){
    cellEls.push([]);
    for(let c=0;c<N;c++){
      const b=document.createElement('button');
      b.className='cell';
      b.style.left=(first+gap*c)+'%'; b.style.top=(first+gap*r)+'%';
      b.addEventListener('click', ()=>onCellClick(r,c));
      el.appendChild(b);
      cellEls[r].push(b);
    }
  }
}

let cellEls = [];

function render(){
  for(let r=0;r<N;r++){
    for(let c=0;c<N;c++){
      const cell = cellEls[r][c];
      const v = board[r][c];
      if(v===EMPTY){ cell.innerHTML=''; continue; }
      const isLast = lastMove && lastMove.r===r && lastMove.c===c;
      // 既に同じ状態なら作り直さない（無駄なアニメ防止）
      const cur = cell.firstChild;
      const wantClass = 'stone ' + (v===BLACK?'black':'white') + (isLast?' last':'');
      if(cur && cur.className===wantClass) continue;
      cell.innerHTML='';
      const st=document.createElement('div');
      st.className=wantClass;
      cell.appendChild(st);
    }
  }
  document.getElementById('capBlack').textContent = capB;
  document.getElementById('capWhite').textContent = capW;
  document.getElementById('goalBlack').textContent = '勝利まで ' + targetB + '個';
  document.getElementById('goalWhite').textContent = '勝利まで ' + targetW + '個';
}

function updateTurn(){
  const t=document.getElementById('turnText');
  if(turn===HUMAN){ t.textContent='あなたの番です'; t.className='turn you'; }
  else            { t.textContent='コンピュータが考えています…'; t.className='turn cpu'; }
}

/* トースト */
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1600);
}

/* =========================================================
   ゲーム開始
   ========================================================= */
function startGame(){
  targetB = parseInt(document.getElementById('selBlack').value,10);
  targetW = parseInt(document.getElementById('selWhite').value,10);
  board = newBoard();
  turn = HUMAN; koPoint = null; gameOver = false;
  capB = 0; capW = 0; placedB = 0; placedW = 0;
  lastMove = null; busy = false;
  showScreen('game');
  render();
  updateTurn();
}

/* =========================================================
   初期化
   ========================================================= */
function init(){
  // 勝利条件の選択肢（1〜20個）
  const selB=document.getElementById('selBlack');
  const selW=document.getElementById('selWhite');
  for(let i=1;i<=20;i++){
    const o1=document.createElement('option'); o1.value=i; o1.textContent=i+'個'; selB.appendChild(o1);
    const o2=document.createElement('option'); o2.value=i; o2.textContent=i+'個'; selW.appendChild(o2);
  }
  selB.value='5'; selW.value='5';

  buildBoard();

  document.getElementById('btnStart').addEventListener('click', startGame);
  document.getElementById('btnQuit').addEventListener('click', ()=>{
    if(!gameOver) endGame('quit');
  });
  document.getElementById('btnAgain').addEventListener('click', ()=>{
    document.getElementById('overlay').style.display='none';
    showScreen('start');
  });

  showScreen('start');
}

init();
</script>
